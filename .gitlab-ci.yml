stages:
  - lint
  - test
  - build
  - security

variables:
  PYTHON_IMAGE: "python:3.13-slim"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/
    - venv/

# Stage 1: Linting
lint-job:
  stage: lint
  image: $PYTHON_IMAGE
  script:
    - pip install --upgrade pip
    - pip install flake8
    - flake8 app/ tests/ --max-line-length=120 --ignore=E501,W503
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"'

# Stage 2: Unit Testing & Verification
unit-test-job:
  stage: test
  image: $PYTHON_IMAGE
  before_script:
    - pip install --upgrade pip
    - pip install -r requirements.txt pytest httpx
  script:
    - python -m pytest tests/ -v
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"'

# Stage 3: Build & Package Docker Image
build-docker-job:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $IMAGE_TAG -t $CI_REGISTRY_IMAGE:latest .
    - docker push $IMAGE_TAG
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# Stage 4: Container Security Scanning
security-scan-job:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --severity HIGH,CRITICAL --no-progress $IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
