apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-churn-service
  labels:
    app: spotify-churn-service
    app.kubernetes.io/name: spotify-churn-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spotify-churn-service
  template:
    metadata:
      labels:
        app: spotify-churn-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: churn-api
          image: spotify-churn-api:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: spotify-churn-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Liveness probe: restarts container if server becomes unresponsive
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness probe: ensures model pipeline is in memory before routing traffic
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
